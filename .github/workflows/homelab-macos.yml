name: Homelab macOS build
run-name: Homelab ${{ inputs.release_tag }} ${{ inputs.source_revision }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Promoted Forgejo version
        required: true
        type: string
      source_revision:
        description: Verified Forgejo commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homelab-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VITE_API_URL: https://ca.mikeux.com:188
      VITE_WS_URL: wss://ca.mikeux.com:188/ws
      VITE_APP_URL: https://ca.mikeux.com:188
      MULTICA_UPDATE_URL: https://ca.mikeux.com:188/api/desktop-updates
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate promoted source and set version
        run: python3 .github/homelab-manifest.py prepare
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.27.4"
          check-latest: true
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - name: Package Apple Silicon
        working-directory: apps/desktop
        run: pnpm package -- --mac --arm64 --config electron-builder.selfhost.yml "-c.publish.url=$MULTICA_UPDATE_URL" -c.publish.channel=latest --publish never
      - name: Verify package and write build manifest
        run: python3 .github/homelab-manifest.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: multica-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 30
